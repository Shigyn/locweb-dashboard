<!doctype html>
<html lang="fr" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Console LocWeb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/console.css?v=2">
</head>
<body>

<!-- ================= connexion ================= -->
<section class="connexion" id="ecran-connexion" style="display:none">
  <div class="connexion-boite">
    <p class="connexion-marque">Console<i>LocWeb</i></p>
    <p>Acces reserve. Connectez-vous avec votre compte operateur.</p>

    <form id="form-connexion" novalidate>
      <label class="champ">
        <span>Adresse e-mail</span>
        <input type="email" id="ident-email" autocomplete="username" required>
      </label>
      <label class="champ">
        <span>Mot de passe</span>
        <input type="password" id="ident-mdp" autocomplete="current-password" required>
      </label>
      <p class="mot" data-ton="alerte" id="connexion-erreur"></p>
      <button class="bt bt-vif bt-large" type="submit" id="bt-connexion">Se connecter</button>
    </form>

    <p style="margin-top:14px;text-align:center">
      <button class="bt bt-nu bt-mini" id="bt-oubli" type="button">Mot de passe oublie</button>
    </p>
  </div>
</section>

<!-- ================= console ================= -->
<div class="console" id="console">

  <nav class="rail" aria-label="Navigation principale">
    <a class="rail-marque" href="#/clients">Console<i>LocWeb</i></a>

    <div class="rail-nav">
      <a href="#/clients" data-route="clients">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Clients
      </a>
      <a href="#/demandes" data-route="demandes">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v12H8l-4 4V5Z"/></svg>
        Demandes
        <b class="pastille" id="pastille-demandes" hidden>0</b>
      </a>
      <a href="#/performances" data-route="performances">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7 15 4-5 3 3 5-7"/></svg>
        Performances
      </a>
    </div>

    <p class="rail-titre">Acquisition</p>
    <div class="rail-nav">
      <a href="#/campagnes" data-route="campagnes">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4h4l6 4V6L7 10H3Z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>
        Campagnes
        <b class="pastille" id="pastille-campagnes" hidden>0</b>
      </a>
      <a href="#/mots-cles" data-route="mots-cles">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m20 12-8.5 8.5a2.8 2.8 0 0 1-4 0l-4-4a2.8 2.8 0 0 1 0-4L12 4h8v8Z"/><circle cx="16.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/></svg>
        Mots-cles
      </a>
    </div>

    <div class="rail-pied">
      <div class="rail-nav">
        <button type="button" id="bt-theme" style="width:100%;text-align:left">
          <span style="display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:.885rem;color:var(--encre-douce)">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span id="libelle-theme">Theme</span>
          </span>
        </button>
      </div>
      <div class="rail-compte">
        <span class="rond" id="compte-initiale">N</span>
        <span class="qui">
          <span id="compte-nom">Operateur</span>
          <small id="compte-mail"></small>
        </span>
        <button class="bt bt-nu bt-mini" id="bt-deconnexion" title="Se deconnecter" style="margin-left:auto">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="zone">
    <header class="barre">
      <div id="barre-gauche"></div>
      <div class="droite" id="barre-droite"></div>
    </header>
    <div class="page" id="page"></div>
  </main>
</div>

<script type="module" src="js/app.js?v=2"></script>
</body>
</html>
